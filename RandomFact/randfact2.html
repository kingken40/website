<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Facts</title>
  <link rel="stylesheet" href="style3_2.css">
</head>
<body>
  <div class="refresh" id="refresh">
        &nbsp;&nbsp;&nbsp;<button onclick="location.reload(true);">Refresh</button>
  </div>
  <div class="container">
    <div class="goBack">
        <button class="return" onclick="location.href='../Games.html'">Return to Games page</button>
    </div>
    
    <h1>Random Facts Generator</h1>
    <form id="factForm">
      <input type="number" id="numberInput" placeholder="Enter a number (1-10)" min="1" max="10" required>
      <button type="submit">Get Fact</button>
    </form>
    <p id="output"></p>
    <!-- <h2 id="factHistory" class="factHistory" style="position:absolute;">Previous Facts</h2> -->
    <ul id="factList"></ul>
  </div>
  <script src="scripts2.js"></script>
  <script>
        // Function to refresh the page
        function refreshPage() {
            // Reloads the current page from the server
            location.reload(true);
        }
    </script>
</body>
</html>
