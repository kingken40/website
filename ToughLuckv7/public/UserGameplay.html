<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game In Progress</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      padding: 50px;
    }
    input[type="number"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>Game In Progress</h1>
  <p id="gameMode" style="font-size: 18px; font-weight: bold; margin: 10px 0;">Game Mode: <span id="currentMode"></span></p>
  <button onclick="window.location.href='UserGUI.html'">
    Return Home
  </button>

  <form id="gameForm">
    <label for="move">What number is at this position? (0-9): </label>
    <input type="number" id="move" name="move" min="0" max="9" required>
    <button type="submit">Submit</button>
  </form>

  <p id="currentPosition">Current Position: <span id="currentPos">1</span> of <span id="totalMoves"></span></p>
  <p id="attemptsRemaining">Attempts Remaining: <span id="remainingAttempts"></span></p>
  <p id="points">Points: <span id="currentPoints">0</span></p>
  <p id="timeElapsed">Time Elapsed: <span id="elapsedTime">0</span> seconds</p>
  <p id="message"></p>

  <script>
  // ToughLuck Game Logic - Embedded
  class ToughLuckGame {
    constructor() {
        this.pathList = [];
        this.currentPosition = 1;
        this.points = 0;
        this.missed = 0;
        this.chances = 3;
        this.attemptsForCurrentPosition = 0;
        this.mode = 'easy';
        this.totalMoves = 5;
        this.allowDuplicates = true;
        this.maxChances = 3;
        this.pointsPerCorrectMove = 2;
    }

    initialize(moves, mode, allowDuplicates) {
        this.totalMoves = moves;
        this.mode = mode;
        this.allowDuplicates = allowDuplicates;
        this.currentPosition = 1;
        this.points = 0;
        this.missed = 0;
        this.attemptsForCurrentPosition = 0;

        if (mode === 'endless' || mode === 'easy') {
            this.maxChances = 3;
            this.pointsPerCorrectMove = 2;
            this.chances = 3;
        } else if (mode === 'level1' || mode === 'medium') {
            this.maxChances = 3;
            this.pointsPerCorrectMove = 3;
            this.chances = 3;
        } else if (mode === 'level2' || mode === 'hard') {
            this.maxChances = 1;
            this.pointsPerCorrectMove = 5;
            this.chances = 1;
        }

        if (allowDuplicates) {
            this.pathList = Array.from({ length: moves }, () => Math.floor(Math.random() * 10));
        } else {
            this.pathList = this.shuffleArray([...Array(10).keys()]).slice(0, moves);
        }

        console.log("=== DEBUG: ANSWER KEY ===");
        console.log("Path:", this.pathList.join(" → "));
        console.log("========================");
    }

    shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    processMove(move) {
        const correctValue = this.pathList[this.currentPosition - 1];
        let message = "";
        let moveToNext = false;
        let gameOver = false;
        let win = false;

        this.points = Math.max(this.points, 0);
        this.chances = Math.max(this.chances, 0);
        this.attemptsForCurrentPosition = Math.max(this.attemptsForCurrentPosition, 0);

        if (move === correctValue) {
            this.points += this.pointsPerCorrectMove;
            message = "Good Move!";
            moveToNext = true;
            this.attemptsForCurrentPosition = 0;
            this.currentPosition++;
            
            if (this.currentPosition > this.totalMoves) {
                win = true;
            }
        } else {
            this.missed++;
            this.attemptsForCurrentPosition++;

            if (this.mode === 'endless' || this.mode === 'easy') {
                this.chances--;
                message = "Wrong! Try again.";
            } else if (this.mode === 'level1' || this.mode === 'medium' || this.mode === 'level2' || this.mode === 'hard') {
                this.chances--;
                
                if (this.attemptsForCurrentPosition >= this.maxChances) {
                    message = "Game Over";
                    gameOver = true;
                    this.chances = 0;
                    this.attemptsForCurrentPosition = this.maxChances;
                } else {
                    const remaining = this.maxChances - this.attemptsForCurrentPosition;
                    if (this.mode === 'level1' || this.mode === 'medium') {
                        if (remaining === 1) {
                            message = "Wrong! Last chance.";
                        } else {
                            message = `Wrong! Try again. Attempts left: ${remaining}`;
                        }
                    } else if (this.mode === 'level2' || this.mode === 'hard') {
                        message = `Wrong! Try again. Attempts left: ${remaining}`;
                    }
                }
            }
        }

        return {
            Points: this.points,
            CurrentPosition: this.currentPosition,
            Message: message,
            Win: win,
            GameOver: gameOver,
            MoveToNext: moveToNext,
            pathList: this.pathList,
            MissedPlayerMoves: this.missed,
            Chances: this.chances,
            AttemptsForCurrentPosition: this.attemptsForCurrentPosition
        };
    }
  }

  // Initialize game instance
  const game = new ToughLuckGame();
  let userMoves = [];
  let gameStarted = false;

  // Retrieve parameters from the URL
  const urlParams = new URLSearchParams(window.location.search);
  const totalMoves = parseInt(urlParams.get('moves')) || 5;
  const mode = urlParams.get('mode');
  const allowDuplicates = urlParams.get('duplicates') === '1';

  // Map mode names for display
  function getModeName(val) {
    if (!val) return "Unknown";
    val = val.toLowerCase();
    if (val === "easy" || val === "endless") return "Endless";
    if (val === "medium" || val === "level1") return "TL-1";
    if (val === "hard" || val === "level2") return "TL-2";
    return val.charAt(0).toUpperCase() + val.slice(1);
  }

  // Display the current game mode
  document.getElementById('currentMode').innerText = getModeName(mode);

  // Initialize the game
  game.initialize(totalMoves, mode, allowDuplicates);
  gameStarted = true;

  // Set initial display values
  document.getElementById('totalMoves').innerText = totalMoves;
  if (mode === 'endless' || mode === 'easy') {
    document.getElementById('remainingAttempts').innerText = '∞';
  } else if (mode === 'level2') {
    document.getElementById('remainingAttempts').innerText = '0';
  } else {
    document.getElementById('remainingAttempts').innerText = game.maxChances;
  }

  function updateAttemptsDisplay() {
    if (mode === 'endless' || mode === 'easy') {
      document.getElementById('remainingAttempts').innerText = '∞';
    } else if (mode === 'level2') {
      document.getElementById('remainingAttempts').innerText = '0';
    } else {
      const remaining = game.maxChances - game.attemptsForCurrentPosition;
      document.getElementById('remainingAttempts').innerText = remaining;
    }
  }

  let startTime = Date.now();
  setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('elapsedTime').innerText = elapsed;
  }, 1000);

  function redirectToResults() {
    let pathListLength = game.pathList.length;
    let pathListString = game.pathList.join(',');
    let userMovesString = userMoves.join(',');
    let missed = game.missed;
    let elapsedTime = Math.floor((Date.now() - startTime) / 1000);

    window.location.href = `UserResults.html?path_list=${encodeURIComponent(pathListString)}` +
    `&path_list_length=${pathListLength}` +
    `&user_moves=${encodeURIComponent(userMovesString)}` +
    `&points=${game.points}` +
    `&total_available_points=${game.pointsPerCorrectMove * pathListLength}` +
    `&missed=${missed}` +
    `&total_moves=${userMoves.length}` +
    `&elapsed_time=${elapsedTime}` +
    `&mode=${encodeURIComponent(mode)}`;
  }

  document.getElementById('gameForm').onsubmit = function(event) {
    event.preventDefault();

    const move = parseInt(document.getElementById('move').value);
    if (isNaN(move) || move < 0 || move > 9) {
        document.getElementById('message').innerText = "Please enter a valid number between 0 and 9.";
        return;
    }

    userMoves.push(move);

    // Process move using local game logic
    const data = game.processMove(move);

    game.points = data.Points;
    game.missed = data.MissedPlayerMoves;
    document.getElementById('currentPoints').innerText = game.points;
    document.getElementById('message').innerText = data.Message;

    // If move was correct, reset attempts and move to next position
    if (data.MoveToNext) {
        game.currentPosition = data.CurrentPosition;
        game.attemptsForCurrentPosition = 0;
        document.getElementById('currentPos').innerText = game.currentPosition;
        updateAttemptsDisplay();
        document.getElementById('move').value = '';
        if (game.currentPosition > totalMoves) {
            redirectToResults();
            return;
        }
        return;
    }

    // Game over due to attempts (TL-1/TL-2 only, not Endless)
    if (mode === 'level1' || mode === 'level2') {
        const remaining = game.maxChances - game.attemptsForCurrentPosition;
        if (remaining < 1) {
            document.getElementById('message').innerText = "No attempts remaining for this position.";
            redirectToResults();
            return;
        }
    }

    updateAttemptsDisplay();
    document.getElementById('move').value = '';

    if (data.GameOver) {
        redirectToResults();
        return;
    }
  };
  </script>
</body>
</html>
