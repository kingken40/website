<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot v1</title>
    <link rel="stylesheet" href="../styles/styles_ai.css">
</head>
<body>
    <button class="back-button" onclick="window.location.href='/Games.html'">← Back</button>
    <h1>AI Chatbot</h1>
    <div id="chat-container">
        <!-- AI greeting will be added here by JavaScript -->
    </div>
    <!-- Textbox -->
    <input type="text" placeholder="Type your message here..." maxlength="50" autocomplete="off" spellcheck="true" title="Enter your message" />
    <div class="char-counter">
        <span id="char-count">0</span>/50
    </div>
    <button>↑</button>

    <script src="../scripts/ai.js"></script>
</body>
</html>
